<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#A67B3E"/>
      <stop offset="50%" stop-color="#C89B5A"/>
      <stop offset="100%" stop-color="#DAB57A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89B5A"/>
      <stop offset="100%" stop-color="#A67B3E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#111111"/>

  <!-- Outer ember flame (large, subtle) -->
  <path d="M256 80
    C256 80, 148 200, 148 310
    C148 370, 196 432, 256 432
    C316 432, 364 370, 364 310
    C364 200, 256 80, 256 80Z"
    fill="none" stroke="url(#flameGrad)" stroke-width="8" opacity="0.25"/>

  <!-- Inner ember flame (solid gold) -->
  <path d="M256 160
    C256 160, 192 240, 192 310
    C192 346, 220 380, 256 380
    C292 380, 320 346, 320 310
    C320 240, 256 160, 256 160Z"
    fill="url(#flameGrad)" opacity="0.9"/>

  <!-- Inner bright core -->
  <path d="M256 250
    C256 250, 230 290, 230 320
    C230 338, 242 350, 256 350
    C270 350, 282 338, 282 320
    C282 290, 256 250, 256 250Z"
    fill="#DAB57A" opacity="0.6"/>

  <!-- Right olive leaf -->
  <path d="M330 260
    C348 248, 380 252, 390 275
    C370 285, 345 282, 330 268Z"
    fill="url(#leafGrad)" opacity="0.7"/>
  <!-- Leaf vein -->
  <line x1="335" y1="264" x2="380" y2="268" stroke="#111111" stroke-width="2" opacity="0.3"/>

  <!-- Left olive leaf (mirror) -->
  <path d="M182 260
    C164 248, 132 252, 122 275
    C142 285, 167 282, 182 268Z"
    fill="url(#leafGrad)" opacity="0.55"/>
  <line x1="177" y1="264" x2="132" y2="268" stroke="#111111" stroke-width="2" opacity="0.3"/>

</svg>
